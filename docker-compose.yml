services:
  ubuntu-ssh:
    build: .
    image: ubuntu-sshd:24.04
    container_name: zcode-ubuntu
    hostname: zcode-ubuntu
    restart: unless-stopped
    init: true
    ports:
      - "2222:22"
    environment:
      SSH_USERNAME: xin
      SSH_PASSWORD: "change-me-please"
      SSH_UID: "1002"
      SSH_GID: "1002"
    volumes:
      - ./ssh-host-keys:/etc/ssh/keys
      - ./home:/home/xin
